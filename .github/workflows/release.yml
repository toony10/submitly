name: Release

# On every push to main, Changesets either opens/updates a "Version Packages" PR
# (when there are pending changesets) or, once that PR is merged, publishes to npm.
# Publishing uses npm trusted publishing (OIDC): no NPM_TOKEN secret, provenance
# is attached automatically. Configure the trusted publisher once on npmjs.com:
# package settings -> Trusted publishing -> GitHub Actions, workflow `release.yml`.

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          # Trusted publishing needs npm >= 11.5.1 (bundled with Node 24).
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter submitly build
      - uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm release
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
